<!doctype html>
<!--
  lang is the language of the INTERFACE COPY, not of the clinic's country.
  All UI text below is English, so lang="en" — a screen reader would otherwise
  read English words with Macedonian phonetics. Switch to "mk" (or "sq") only
  when the copy itself is translated.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d7791" />
    <title>JVD Dental Clinic — Gostivar</title>
    <meta
      name="description"
      content="JVD Dental Clinic — a family dental practice with two clinics in Gostivar. Choose your dentist and your clinic, and call to book."
    />

    <!-- The Cal.com preconnect is injected by vite.config.js, but only when
         VITE_BOOKING_MODE=cal. In phone mode it would be a wasted handshake
         on every page load. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Local variable font, no external font request.
      Drop inter-var.woff2 (latin + CYRILLIC subset — the addresses are Cyrillic)
      into /public/fonts, then uncomment the preload below. Leaving it commented
      until the file exists avoids a failed request on every page load; the
      @font-face in index.css already falls back to the system UI font.
    -->
    <!-- <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin /> -->

    <!-- Open Graph -->
    <meta property="og:title" content="JVD Dental Clinic — Gostivar" />
    <meta property="og:description" content="A family dental practice with two clinics in Gostivar. Three dentists, one standard of care." />
    <meta property="og:locale" content="en" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
