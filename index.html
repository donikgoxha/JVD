<!doctype html>
<!-- lang follows the copy (English), not the country -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d7791" />
    <title>JVD Dental Clinic | Gostivar</title>
    <meta
      name="description"
      content="Family dental practice in Gostivar with clinics on Boulevard Goce Delchev and Brakja Gjinoski. Call either clinic or your dentist directly."
    />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- keep in sync with the @font-face src URLs in index.css -->
    <link rel="preload" href="/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-var.woff2" as="font" type="font/woff2" crossorigin />

    <!-- og:url, og:image and twitter:image are added by vite.config.js -->
    <meta property="og:title" content="JVD Dental Clinic | Gostivar" />
    <meta
      property="og:description"
      content="Family dental practice in Gostivar with clinics on Boulevard Goce Delchev and Brakja Gjinoski. Call either clinic or your dentist directly."
    />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JVD Dental Clinic" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JVD Dental Clinic, Gostivar" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
